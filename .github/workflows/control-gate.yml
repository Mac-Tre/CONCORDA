name: Concorda decision and release gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  control-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_demo_gate.py' -v
      - run: python -m tools.demo_gate --register docs/DECISIONS.json
